  - name: NUMNOTA
    oracle_type: NUMBER(10)
    clickhouse_type: Int64
    nullable: false
    use: proposed
    ref: fato_devolucao.num_nota_devolucao
  - name: ESPECIE
    oracle_type: VARCHAR2(2)
    clickhouse_type: String
    nullable: false
    use: scope
    ref: fato_compra.especie
  - name: SERIE
    oracle_type: VARCHAR2(3)
    clickhouse_type: String
    nullable: true
    use: scope
    ref: fato_compra.serie
    comment: Indica a serie.|Campo do tipo caracter, de tamanho 3.
  - name: TIPODESCARGA
    oracle_type: VARCHAR2(1)
    clickhouse_type: String
    nullable: true
    use: scope
    ref: fato_compra.tipo_entrada
  - name: CODDEVOL
    oracle_type: NUMBER(4)
    clickhouse_type: Int64
    nullable: true
    use: scope
    ref: fato_devolucao.cod_motivo_devolucao
  - name: CODUSURDEVOL
    oracle_type: NUMBER(4)
    clickhouse_type: Int64
    nullable: true
    use: scope
    ref: fato_devolucao.cod_rca
  - name: NUMTRANSVENDAORIG
    oracle_type: NUMBER(10)
    clickhouse_type: Int64
    nullable: true
    use: proposed
    ref: fato_devolucao.num_transacao_venda
    note: venda de origem da devolução vinculada; o cliente vem de PCMOV.CODCLI ou da nota de origem
    comment: Indica a transação original de entrada consignação.
  - name: NUMPEDPRINC
    oracle_type: NUMBER(8)
    clickhouse_type: Int64
    nullable: true
    use: proposed
    ref: fato_compra.num_pedido_compra
    note: candidato a pedido de compra de origem (ponto 13); PCNFENT não tem NUMPED
    comment: Número do pedido de compra principal
  - name: DTCANCEL
    oracle_type: DATE
    clickhouse_type: DateTime64(0)
    nullable: true
    use: control
    note: nota cancelada
    comment: Data de Cancelamento
  - name: CODCONT
    oracle_type: NUMBER(10)
    clickhouse_type: Int64
    nullable: false
    use: key
    note: faz parte da chave primária; candidato à regra de contabilização de fato_compra
