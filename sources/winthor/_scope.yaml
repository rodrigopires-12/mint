      - {name: CLIPOSPREV, use: scope, ref: fato_meta.positivacao_meta}
      - {name: MIXPREV, use: scope, ref: fato_meta.mix_meta}
      - {name: QTPESOPREV, use: scope, ref: fato_meta.peso_meta}
