      - {name: NUMCLIPOS, use: proposed, ref: fato_meta.positivacao_meta, note: "o escopo cita CLIPOSPREV, que não existe"}
      - {name: QTITENSPEDPREV, use: proposed, ref: fato_meta.mix_meta, note: "candidato a mix (itens por pedido); o escopo cita MIXPREV, que não existe"}
      - {name: QTMETROPREV, use: proposed, ref: fato_meta.volume_meta, note: "candidato a volume; o escopo cita VOLUMEPREV, que não existe"}
    questions:
