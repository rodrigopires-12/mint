    questions:
      - "Ponto 3: o tipo M de PCMETA é meta de RCA? PCMETARCA é outra rotina (353). Escolher a fonte oficial com o negócio."
  PCMETARCA:
    description: Metas de RCA (rotina 353)
    strategy: full
    key: [CODFILIAL, CODUSUR, DATA]
    columns:
